name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  check:
    name: check
    if: always()
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform gate
        if: needs.platform.result != 'success'
        run: exit 1
